name: boerdesnack24
description: Bördesnack24 — Unternehmensplattform (Finanzen, Verwaltung, Kundenbereich).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State-Management & DI
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Backend
  supabase_flutter: ^2.8.0

  # Observability (consent-gated initialisiert)
  sentry_flutter: ^8.12.0
  posthog_flutter: ^4.10.0

  # PDF teilen/drucken (Export Finanzauswertung)
  printing: ^5.13.4

  # Externe Links (Navigation zu Maps, Google-Bewertung)
  url_launcher: ^6.3.1

  # Utility
  equatable: ^2.0.7
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
