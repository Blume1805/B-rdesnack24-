<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#fff;font-family:"Liberation Sans",Arial,sans-serif;}
  .row{display:flex; gap:18px; padding:14px; width:1160px;}
  .cell{flex:1; text-align:center;}
  .badge{width:78px; height:78px; border-radius:50%; background:#000; display:flex; align-items:center; justify-content:center; margin:0 auto 10px auto;}
  .badge svg{width:42px; height:42px;}
  .cell .label{font-size:15px; font-weight:800; color:#000; line-height:1.25;}
  .cell .anker{font-size:12.5px; font-weight:800; color:#8A6E00; margin-top:4px;}
</style></head>
<body>
<div class="row">
  <div class="cell">
    <div class="badge"><svg viewBox="0 0 48 48" fill="none"><rect x="10" y="4" width="28" height="40" rx="2" stroke="#F3BE21" stroke-width="2.6"/><rect x="15" y="9" width="18" height="14" rx="1" stroke="#F3BE21" stroke-width="2.2"/><line x1="15" y1="28" x2="33" y2="28" stroke="#F3BE21" stroke-width="1.8"/><line x1="15" y1="33" x2="33" y2="33" stroke="#F3BE21" stroke-width="1.8"/><line x1="15" y1="38" x2="26" y2="38" stroke="#F3BE21" stroke-width="1.8"/></svg></div>
    <div class="label">Snacks &amp; Getränke</div>
    <div class="anker">62 Produkte</div>
  </div>
  <div class="cell">
    <div class="badge"><svg viewBox="0 0 48 48" fill="none"><rect x="13" y="4" width="22" height="40" rx="4" stroke="#F3BE21" stroke-width="2.6"/><line x1="13" y1="36" x2="35" y2="36" stroke="#F3BE21" stroke-width="2.2"/><circle cx="24" cy="40" r="1.7" fill="#F3BE21"/></svg></div>
    <div class="label">App-Abo</div>
    <div class="anker">0,99 € / 9,99 €</div>
  </div>
  <div class="cell">
    <div class="badge"><svg viewBox="0 0 48 48" fill="none"><path d="M6 20 L26 12 L26 36 L6 28 Z" stroke="#F3BE21" stroke-width="2.6" stroke-linejoin="round"/><path d="M26 16 L40 10 V38 L26 32" stroke="#F3BE21" stroke-width="2.6" stroke-linejoin="round"/><line x1="12" y1="28" x2="14" y2="38" stroke="#F3BE21" stroke-width="2.4"/></svg></div>
    <div class="label">Werbeplattform</div>
    <div class="anker">ab 15 € / Monat</div>
  </div>
  <div class="cell">
    <div class="badge"><svg viewBox="0 0 48 48" fill="none"><path d="M24 6 L40 12 V22 C40 32 33 40 24 43 C15 40 8 32 8 22 V12 Z" stroke="#F3BE21" stroke-width="2.6" stroke-linejoin="round"/><path d="M17 23 L22 28 L32 17" stroke="#F3BE21" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="label">Sponsoring</div>
    <div class="anker">Sichtbarkeit</div>
  </div>
</div>
</body></html>
