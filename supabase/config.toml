# Supabase-Projektkonfiguration (lokaler Stack & Deploy-Defaults)
# Doku: https://supabase.com/docs/guides/local-development/cli/config

project_id = "boerdesnack24"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

# Die Seed-Datei liegt unter supabase/seed/seed.sql, nicht unter dem
# Standardpfad supabase/seed.sql. Ohne diesen Eintrag laedt `supabase db reset`
# sie nicht — obwohl die Datei selbst in ihrem Kopf behauptet, sie werde
# geladen. Folge bis zum 17.09.2026: Ein frisch aufgebautes Projekt hatte
# keinerlei Rollenrechte, `shareholder` also weder inventory.view noch
# finance.view. In der CI fielen dadurch vier pgTAP-Zusicherungen aus
# (iot_telemetry_rls 8/9, mfa_gate 2/6), sobald der Testschritt ueberhaupt
# erreicht wurde (Befund A-11).
[db.seed]
enabled = true
sql_paths = ["./seed/seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["io.boerdesnack24.app://login-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true                 # Self-Signup für Kunden; interne Nutzer per Einladung
minimum_password_length = 10

[auth.email]
enable_signup = true
enable_confirmations = true          # E-Mail-Bestätigung Pflicht
double_confirm_changes = true

[auth.mfa]
# MFA (TOTP) vorbereitet — vor Go-Live für interne Rollen aktivieren.
max_enrolled_factors = 10

[storage]
enabled = true
file_size_limit = "25MiB"

[edge_runtime]
enabled = true

# Server-Funktionen ohne Anmeldepflicht (verify_jwt = false), Stand der
# Produktion am 16.11.2026. Ohne diese Einträge setzt `supabase functions
# deploy` verify_jwt = true, und die Funktionen würden nach dem Ausliefern
# jeden Aufruf abweisen. Jede prüft selbst:
#   iot-webhook, email-inbound   Signatur (HMAC bzw. Svix)
#   auth-email-hook              Signatur des Supabase-Auth-Hooks
#   weather-sync                 Einmalmarke aus der Datenbank (A2-02)
#   subscription-cancel          öffentliche Kündigung (§ 312k BGB), prüft
#                                Angaben selbst, ordnet bei Anmeldung zu
# Alle übrigen Funktionen verlangen eine Anmeldung (Standard).
[functions.iot-webhook]
verify_jwt = false

[functions.email-inbound]
verify_jwt = false

[functions.auth-email-hook]
verify_jwt = false

[functions.weather-sync]
verify_jwt = false

[functions.subscription-cancel]
verify_jwt = false
