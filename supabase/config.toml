# Supabase-Projektkonfiguration (lokaler Stack & Deploy-Defaults)
# Doku: https://supabase.com/docs/guides/local-development/cli/config

project_id = "boerdesnack24"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["io.boerdesnack24.app://login-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true                 # Self-Signup für Kunden; interne Nutzer per Einladung
minimum_password_length = 10

[auth.email]
enable_signup = true
enable_confirmations = true          # E-Mail-Bestätigung Pflicht
double_confirm_changes = true

# Send-Email-Hook: leitet Auth-Mails an unsere Edge Function um, damit sie
# über das Template-Modul und Resend laufen. Für den lokalen Stack bewusst
# auskommentiert — sonst braucht `supabase start` zwingend einen laufenden
# Function-Container plus Secret, und die Registrierung schlägt lokal fehl.
# Produktiv wird der Hook im Dashboard konfiguriert, siehe
# docs/EMAIL_TEMPLATES.md.
# [auth.hook.send_email]
# enabled = true
# uri = "http://host.docker.internal:54321/functions/v1/auth-email-hook"
# secrets = "env(SEND_EMAIL_HOOK_SECRET)"

[auth.mfa]
# MFA (TOTP) vorbereitet — vor Go-Live für interne Rollen aktivieren.
max_enrolled_factors = 10

[storage]
enabled = true
file_size_limit = "25MiB"

[edge_runtime]
enabled = true

# =============================================================================
# verify_jwt je Function — ausdrücklich, nicht dem Zufall überlassen
# -----------------------------------------------------------------------------
# Anlass (05.08.2026): `auth-email-hook` lief zeitweise mit
# `verify_jwt = true`. Supabase Auth kam damit nicht durch den Torwächter und
# meldete „500: Hook requires authorization token" — ein Webhook kann keinen
# JWT mitschicken. Registrierung und Passwort-Reset waren dadurch tot, und die
# Fehlersuche lief lange in die falsche Richtung, weil die Meldung nach einem
# Signaturproblem aussah.
#
# Ursache: Ohne `[functions.<name>]`-Eintrag nimmt das CLI beim Ausrollen
# seinen Standard — und der ist `verify_jwt = true`. Der Ablauf in
# `.github/workflows/deploy-functions.yaml` setzt bewusst kein
# `--no-verify-jwt`, weil ein pauschaler Schalter die Unterscheidung
# einebnen würde. Diese Datei ist der richtige Ort dafür: eine Zeile je
# Function, im Repository nachlesbar und beim nächsten Ausrollen verbindlich.
#
# `verify_jwt = false` bedeutet NICHT „ungeschützt". Diese fünf tragen ihre
# Zugangsprüfung selbst, weil ihre Aufrufer sich nicht anmelden können.
# =============================================================================

# Supabase Auth ruft den Hook ohne JWT auf. Geschützt per HMAC-Signatur nach
# Standard Webhooks (`SEND_EMAIL_HOOK_SECRET`), Zeitfenster 300 s.
[functions.auth-email-hook]
verify_jwt = false

# Resend liefert Posteingang per Webhook, ebenfalls ohne Anmeldung.
# Geschützt per HMAC (`INBOUND_WEBHOOK_SECRET`).
[functions.email-inbound]
verify_jwt = false

# Automaten-Telemetrie meldet sich mit einem Geräteschlüssel, nicht mit
# einem Benutzer-JWT.
[functions.iot-webhook]
verify_jwt = false

# Kündigungsweg nach § 312k BGB: Er muss OHNE Anmeldung funktionieren.
# Ist doch ein Authorization-Header dabei, wird die Kündigung dem Konto
# zugeordnet — die Function wertet das selbst aus.
[functions.subscription-cancel]
verify_jwt = false

# Wetterabgleich, per Zeitplan aufgerufen.
[functions.weather-sync]
verify_jwt = false

# ── Alle übrigen verlangen einen gültigen JWT ────────────────────────────────
