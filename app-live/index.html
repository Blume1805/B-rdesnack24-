<!DOCTYPE html>
<html lang="de">
<head>
  <base href="/app-live/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Bördesnack24 — Unternehmensplattform">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bördesnack24">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Bördesnack24</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Kritischer Pfad: alles, was für den Start nötig ist, wird sofort
    vorgeladen — parallel zum HTML-Parser. Preconnect zum CanvasKit-CDN
    beschleunigt den TLS-Handshake auf mobilen Netzen deutlich.
  -->
  <link rel="preload" as="script" href="flutter_bootstrap.js?v=1783505151">
  <link rel="preload" as="script" href="main.dart.js">
  <link rel="preload" as="script" href="flutter.js">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">

  <style>
    html, body { margin:0; padding:0; height:100%; background:#14110E; color:#FDC102;
                  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #loader { position:fixed; inset:0; display:flex; flex-direction:column;
              align-items:center; justify-content:center; gap:14px; z-index:9999; padding:32px; }
    #loader .logo { width:64px; height:64px; border:3px solid #FDC102; border-top-color:transparent;
                    border-radius:50%; animation:spin 1s linear infinite; }
    #loader .title { font-weight:700; letter-spacing:2px; font-size:18px; }
    #loader .hint  { color:#a89876; font-size:12px; max-width:80%; text-align:center; }
    #loader .bar   { width:min(240px,60vw); height:6px; background:#332a1e; border-radius:6px; overflow:hidden; }
    #loader .bar > i { display:block; height:100%; width:5%; background:#FDC102; transition:width .35s ease; }
    #err { display:none; position:fixed; inset:24px; background:#1d1813; border:1px solid #FDC102;
           color:#fff; padding:16px; border-radius:12px; font:13px/1.5 monospace; overflow:auto; z-index:10000;
           white-space:pre-wrap; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>

  <!--
    Bootstrap so früh wie möglich starten — main.dart.js lädt parallel zum
    Rest der Seite. `async` verhindert, dass der Parser blockiert.
  -->
  <script async src="flutter_bootstrap.js?v=1783505151"></script>
</head>
<body>
  <div id="loader">
    <div class="logo"></div>
    <div class="title">BÖRDESNACK24</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="hint" id="hint">App wird geladen …</div>
  </div>
  <pre id="err"></pre>
  <script>
    (function () {
      const hint = document.getElementById('hint');
      const err  = document.getElementById('err');
      const bar  = document.getElementById('bar');
      const showErr = (msg) => {
        err.style.display = 'block';
        err.textContent = String(msg);
        const l = document.getElementById('loader'); if (l) l.style.display = 'none';
      };

      window.addEventListener('error', (e) => showErr('Fehler: ' + (e.message || e.error)));
      window.addEventListener('unhandledrejection', (e) => showErr('Promise-Fehler: ' + (e.reason && e.reason.toString())));

      // ── Passkeys-SDK-Stub (Corbado wird transitiv referenziert) ──────────
      const noop = () => {};
      const resolved = () => Promise.resolve();
      const stub = {
        init: noop, setRpId: noop, setRelyingPartyServer: noop,
        register: resolved, authenticate: resolved,
        canAuthenticate: () => Promise.resolve(false),
        isAvailable: () => Promise.resolve(false),
      };
      if (!window.PasskeyAuthenticator) window.PasskeyAuthenticator = stub;
      if (!window.corbadoPasskeys) window.corbadoPasskeys = stub;

      // ── Alte Service-Worker + Caches einmalig entfernen ──────────────────
      (async () => {
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => r.unregister()));
          }
          if ('caches' in window) {
            const names = await caches.keys();
            await Promise.all(names.map((n) => caches.delete(n)));
          }
        } catch (_) {}
      })();

      // ── Simulierter Progress ──────────────────────────────────────────────
      // Kein zusätzlicher fetch() für main.dart.js mehr — der ehemalige
      // Progress-Fetch hat das 4-MB-Bundle DOPPELT über die Leitung gejagt
      // (einmal für den Loader, einmal für flutter_bootstrap) und die
      // Startzeit auf mobilen Netzen effektiv verdoppelt. Wir zeigen
      // stattdessen einen gleichmäßig laufenden Balken und verstecken den
      // Loader, sobald Flutter den ersten Frame gezeichnet hat.
      let done = false;
      let sim = 8;
      const setBar = (p) => { if (!done) bar.style.width = Math.min(90, p) + '%'; };
      const tick = setInterval(() => { sim = Math.min(90, sim + 2); setBar(sim); }, 400);

      const observer = new MutationObserver(() => {
        const glass = document.querySelector('flutter-view, flt-glass-pane, flt-scene-host');
        if (glass) {
          done = true; clearInterval(tick);
          bar.style.width = '100%';
          setTimeout(() => {
            const l = document.getElementById('loader'); if (l) l.style.display = 'none';
          }, 200);
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      setTimeout(() => {
        if (!done) hint.textContent = 'Der erste Aufruf über Mobilfunk kann 10–20 Sekunden dauern …';
      }, 8000);
      setTimeout(() => {
        if (!done) hint.textContent = 'Sollte die Seite länger als 30 Sekunden hängen, bitte einmal neu laden.';
      }, 25000);
    })();
  </script>
</body>
</html>
