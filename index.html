  <!--
    Passkeys-SDK-Stub MUSS vor jedem Skript existieren, das dart2js-Code
    ausführt. Corbado-Plugin ist transitiv über supabase_flutter drin;
    ohne installierten Stub wirft der erste JS-Interop-Aufruf einen
    Null-Check-Fehler → Engine erreicht ersten Frame nie → Loader hängt.
  -->
  <script>
    (function () {
      var noop = function () {};
      var resolved = function () { return Promise.resolve(); };
      var stub = {
        init: noop, setRpId: noop, setRelyingPartyServer: noop,
        register: resolved, authenticate: resolved,
        canAuthenticate: function () { return Promise.resolve(false); },
        isAvailable: function () { return Promise.resolve(false); }
      };
      window.PasskeyAuthenticator = stub;
      window.corbadoPasskeys = stub;
    })();
  </script>

  <style>
    html, body { margin:0; padding:0; height:100%; background:#14110E; color:#FDC102;
                  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #loader { position:fixed; inset:0; display:flex; flex-direction:column;
              align-items:center; justify-content:center; gap:14px; z-index:9999; padding:32px; }
    #loader .logo { width:64px; height:64px; border:3px solid #FDC102; border-top-color:transparent;
                    border-radius:50%; animation:spin 1s linear infinite; }
    #loader .title { font-weight:700; letter-spacing:2px; font-size:18px; }
    #loader .hint  { color:#a89876; font-size:12px; max-width:80%; text-align:center; }
    #loader .bar   { width:min(240px,60vw); height:6px; background:#332a1e; border-radius:6px; overflow:hidden; }
    #loader .bar > i { display:block; height:100%; width:5%; background:#FDC102; transition:width .35s ease; }
    #err { display:none; position:fixed; inset:16px; background:#1d1813; border:1px solid #FDC102;
           color:#fff; padding:14px; border-radius:12px; font:11px/1.4 monospace; overflow:auto; z-index:10000;
           white-space:pre-wrap; max-height:80vh; }
    #retry { display:none; margin-top:8px; padding:10px 16px; background:#FDC102; color:#14110E;
             border:none; border-radius:8px; font-weight:700; cursor:pointer; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader">
    <div class="logo"></div>
    <div class="title">BÖRDESNACK24</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="hint" id="hint">App wird geladen …</div>
    <button id="retry" onclick="location.reload(true)">Neu laden</button>
  </div>
  <pre id="err"></pre>

  <script>
    (function () {
      var hint = document.getElementById('hint');
      var err  = document.getElementById('err');
      var bar  = document.getElementById('bar');
      var retry = document.getElementById('retry');

      // Alle Konsolen-Fehler + Netzwerk-Probleme aufsammeln, um sie im
      // Loader anzuzeigen, falls die App länger hängt. So sieht der User
      // konkret warum — kein „App hängt einfach"-Blackbox mehr.
      var diag = [];
      var log = function (kind, msg) {
        diag.push('[' + kind + '] ' + String(msg));
        if (diag.length > 40) diag.shift();
      };
      window.addEventListener('error', function (e) { log('err', e.message || e.error); });
      window.addEventListener('unhandledrejection', function (e) {
        log('rej', (e.reason && (e.reason.message || e.reason.toString())) || 'unknown');
      });

      // Alte Service-Worker + Caches einmalig entfernen.
      (async function () {
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
          if ('caches' in window) {
            var names = await caches.keys();
            await Promise.all(names.map(function (n) { return caches.delete(n); }));
          }
        } catch (_) {}
      })();

      // Simulierter Progress — springt auf 100 %, sobald Flutter rendert.
      var done = false;
      var sim = 8;
      var setBar = function (p) { if (!done) bar.style.width = Math.min(90, p) + '%'; };
      var tick = setInterval(function () { sim = Math.min(90, sim + 2); setBar(sim); }, 400);

      var observer = new MutationObserver(function () {
        var glass = document.querySelector('flutter-view, flt-glass-pane, flt-scene-host');
        if (glass) {
          done = true; clearInterval(tick);
          bar.style.width = '100%';
          setTimeout(function () {
            var l = document.getElementById('loader'); if (l) l.style.display = 'none';
          }, 200);
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      setTimeout(function () {
        if (!done) hint.textContent = 'Erster Aufruf über Mobilfunk kann 10–20 s dauern …';
      }, 8000);

      // Nach 20 s: Diagnose einblenden und Neu-laden-Button zeigen.
      setTimeout(function () {
        if (done) return;
        retry.style.display = 'inline-block';
        var meta = [];
        meta.push('URL: ' + location.href);
        meta.push('UA:  ' + navigator.userAgent);
        meta.push('window.PasskeyAuthenticator: ' + typeof window.PasskeyAuthenticator);
        meta.push('window._flutter: ' + typeof window._flutter);
        meta.push('flutter-view im DOM: ' + !!document.querySelector('flutter-view'));
        meta.push('main.dart.js geladen: ' + !!document.querySelector('script[src*="main.dart.js"]'));
        meta.push('canvaskit-preload ok: ' + performance.getEntriesByName(new URL('canvaskit/canvaskit.js', location.href).toString()).length);
        err.textContent = 'Diagnose (nach 20 s):\n\n' + meta.join('\n') + '\n\nErrors:\n' + (diag.length ? diag.join('\n') : '(keine)');
        err.style.display = 'block';
      }, 20000);
    })();
  </script>

  <!--
    Bootstrap am Ende des Bodies (Flutter-Default) — DOM ist fertig und
    Passkeys-Stub garantiert schon installiert.
  -->
  <script src="flutter_bootstrap.js?v=1783675624" async></script>
</body>
</html>
