name: CI

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter (analyze · format · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Feste Version seit 16.11.2026: Die nächste stabile Version
          # markiert package:flutter/material.dart als veraltet, und
          # `flutter analyze` wurde dadurch rot, ohne dass sich Code
          # geändert hatte. Hochsetzen bewusst in eigenem Commit.
          flutter-version: 3.47.9
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Lokalisierung generieren
        run: flutter gen-l10n
      - name: Codegen (build_runner, sofern konfiguriert)
        run: |
          if grep -q build_runner pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "Keine Codegen-Abhängigkeit – übersprungen."
          fi
      - name: Format-Check
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Tests (mit Coverage)
        run: flutter test --coverage
      - name: Coverage-Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apps/mobile/coverage/lcov.info
          if-no-files-found: ignore

  edge-functions:
    name: Edge Functions (Deno lint · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Blockierend seit 16.11.2026 (Audit A2-06). Vorher verschluckte
      # `|| true` jeden Fehler. require-await ist abgeschaltet: elf Funktionen
      # sind bewusst async, weil die aufrufende Schnittstelle ein Promise
      # erwartet; das ist Stil, kein Fehler.
      - name: Lint
        run: deno lint --rules-exclude=require-await supabase/functions
      - name: Test
        run: deno test --allow-all supabase/functions

  datenbank:
    # Seit 16.11.2026 baut dieser Schritt die Produktionslinie (dieselben
    # Migrationen wie die echte Datenbank) auf PostgreSQL 17 nach. Die alte
    # main-Linie (0001–0070) ist stillgelegt; sie steht im Git-Verlauf bis
    # Commit f08e63b (docs/audit/AUDIT-2026-11-ZIELBILD-4-5.md, A1).
    # Kein Schritt hier berührt die Produktion.
    name: Datenbank (Produktionslinie · Prüfskripte · pgTAP · Fingerabdruck)
    runs-on: ubuntu-24.04
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 17 und pgTAP installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-17 postgresql-17-pgtap
          # Auf dem GitHub-Rechner legt das Paket keinen Cluster an
          # (Lauf 903 am 16.11.2026: "cluster '17 main' does not exist").
          if ! pg_lsclusters -h | awk '$1 == "17"' | grep -q .; then
            sudo pg_createcluster 17 main
          fi
          sudo pg_ctlcluster 17 main start || true
          PORT=$(pg_lsclusters -h | awk '$1 == "17" {print $3}')
          echo "PGPORT=$PORT" >> "$GITHUB_ENV"
          sudo -u postgres psql -p "$PORT" -c "alter user postgres password 'postgres';"
          PGPORT=$PORT psql -d postgres -Atc 'select version()'
      - name: Aufbau mit Prüfdaten
        run: scripts/pruefumgebung/aufbauen.sh pruef
      - name: Prüfskripte (Datenisolation, Rechte, Geschäftsregeln)
        run: scripts/pruefumgebung/pruefen.sh pruef
      - name: Aufbau ohne Prüfdaten
        run: scripts/pruefumgebung/aufbauen.sh tap --ohne-pruefdaten
      - name: Fingerabdruck gegen Sollwert
        # Schlägt fehl, wenn eine Migration hinzukam, ohne dass
        # scripts/pruefumgebung/fingerabdruck.soll nachgezogen wurde.
        run: scripts/pruefumgebung/fingerabdruck_vergleichen.sh tap
      - name: pgTAP-Tests
        run: scripts/pruefumgebung/pgtap.sh tap
