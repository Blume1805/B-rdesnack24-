name: CI

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter (analyze · format · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Lokalisierung generieren
        run: flutter gen-l10n
      # `id: setup` ist der letzte Einrichtungsschritt. Die drei Prüfungen
      # darunter hängen daran — siehe Begründung dort.
      - name: Codegen (build_runner, sofern konfiguriert)
        id: setup
        run: |
          if grep -q build_runner pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "Keine Codegen-Abhängigkeit – übersprungen."
          fi

      # ------------------------------------------------------------------
      # Die drei Prüfungen laufen unabhängig voneinander.
      #
      # Vorher brach der Ablauf beim ersten Fehler ab. Am 03.08.2026 hat ein
      # Formatierungsbefund an sechs Dateien deshalb zwei Tage lang verdeckt,
      # dass `analyze` drei weitere Stellen zu melden hatte — und die Tests
      # liefen in dieser Zeit überhaupt nicht. Man repariert eine Sache,
      # pusht, wartet, und bekommt die nächste serviert: eine Runde je
      # Befund.
      #
      # `!cancelled()` statt `always()`: Ein abgebrochener Lauf soll auch
      # wirklich abbrechen. Und `steps.setup.outcome == 'success'` davor,
      # weil Prüfungen ohne aufgelöste Abhängigkeiten nur Folgefehler
      # ausspucken — dann ist Schweigen nützlicher.
      #
      # Der Lauf wird trotzdem rot, sobald eine der drei fehlschlägt. Es
      # geht ums Sehen, nicht ums Durchwinken.
      # ------------------------------------------------------------------
      - name: Format-Check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: flutter analyze
      - name: Tests (mit Coverage)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: flutter test --coverage

      - name: Coverage-Artefakt
        # Auch wenn Tests fehlschlagen: Die Abdeckung der bestandenen Tests
        # ist dann besonders interessant.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apps/mobile/coverage/lcov.info
          if-no-files-found: ignore

  edge-functions:
    name: Edge Functions (Deno lint · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Lint
        run: deno lint supabase/functions || true
      - name: Test
        run: deno test --allow-all supabase/functions || true

  migrations:
    name: Migrations-Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bewusst OHNE `|| true`: Dieser Schritt darf den Lauf rot machen.
      # Er sucht die NULL-Falle in der Rollenprüfung, die am 03.08.2026
      # siebzehn Funktionen betraf und mit der sich Unterschriften
      # ersetzen liessen (Migrationen 0093–0095). Eine Prüfung, die man
      # ignorieren kann, hätte den Fund nicht verhindert.
      - name: Rollenprüfungen auf die NULL-Falle prüfen
        run: python3 scripts/check_rollenpruefung.py
      # Ebenfalls blockierend. Sucht den Auslöser statt des Symptoms:
      # Ruft der Code eine Datenbankfunktion auf, die keine Migration
      # anlegt, entzieht sich deren Quelltext jeder Codeprüfung — genau
      # dadurch blieb die NULL-Falle in acht Funktionen unentdeckt.
      - name: Aufgerufene Datenbankfunktionen müssen im Repository stehen
        run: python3 scripts/check_rpc_vollstaendig.py
      - name: Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start DB & Migrationen anwenden
        run: |
          supabase db start || supabase start || true
          supabase db reset --debug || true
      - name: RLS-/Permission-Tests (pgTAP)
        # Vorerst nicht-blockierend, bis gegen ein Live-Projekt verifiziert.
        run: supabase test db || true
