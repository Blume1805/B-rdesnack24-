# =============================================================================
# Edge Functions ausrollen
# -----------------------------------------------------------------------------
# Warum es diesen Ablauf gibt:
#
# Aus der Arbeitsumgebung heraus lässt sich `api.supabase.com` nicht
# erreichen — der Egress-Proxy lehnt den Host per Richtlinie ab (403). Damit
# ist das Supabase-CLI dort tot, unabhängig davon, ob ein gültiger Token
# vorliegt. Bis dahin blieb nur, Dateiinhalte einzeln über die
# MCP-Schnittstelle hochzuladen: bei ~28 KB je Mail-Funktion mühsam,
# fehleranfällig und nie nachweislich byte-genau.
#
# Ein GitHub-Runner hat diese Beschränkung nicht. Er checkt den Stand aus,
# den ihr auch lest, und rollt ihn unverändert aus. Damit ist das, was in
# Supabase läuft, wieder dasselbe wie das, was im Repository steht — und
# genau das war zuletzt nicht mehr sicher.
#
# -----------------------------------------------------------------------------
# Einmalige Einrichtung
#
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#     Name:  SUPABASE_ACCESS_TOKEN
#     Wert:  ein Token aus https://supabase.com/dashboard/account/tokens
#
# Bitte einen FRISCHEN Token anlegen. Ein Token, der einmal durch einen Chat
# gelaufen ist, gilt als offengelegt — er steht dort dauerhaft im Verlauf.
#
# -----------------------------------------------------------------------------
# Absichtlich nur von Hand auslösbar
#
# Kein Ausrollen bei jedem Push. Eine Edge Function greift sofort und für
# alle; ein Tippfehler in `auth-email-hook` legt die Anmeldung lahm, ohne
# dass ein Test dazwischen wäre. Wann etwas produktiv geht, entscheidet ein
# Mensch.
# =============================================================================
name: Edge Functions ausrollen

on:
  workflow_dispatch:
    inputs:
      functions:
        description: >-
          Welche Functions? Leer lassen für die fünf offenen. "alle" rollt
          jede Function im Verzeichnis aus.
        required: false
        default: ''
      dry_run:
        description: 'Nur anzeigen, was ausgerollt würde'
        type: boolean
        required: false
        default: false

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: supabase functions deploy
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nnfsyuglkqycwenwxmuw

    steps:
      - uses: actions/checkout@v4

      - name: Token vorhanden?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Das Secret SUPABASE_ACCESS_TOKEN fehlt. Siehe Kopf dieser Datei."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Auswahl bestimmen
        id: auswahl
        run: |
          EINGABE="${{ github.event.inputs.functions }}"
          if [ "$EINGABE" = "alle" ]; then
            # Alles ausser _shared — das ist kein Deployziel, sondern werden
            # als relative Importe mitgezogen.
            LISTE=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d \
                      ! -name '_shared' -printf '%f\n' | sort | tr '\n' ' ')
          elif [ -n "$EINGABE" ]; then
            LISTE="$EINGABE"
          else
            # Die fünf, die auf dieses Ausrollen warten: vier Mail-Functions
            # (DB-Vorlagen + Maskierung von title/preheader in components.ts)
            # und document-finalize (Finanzzahlen).
            LISTE="subscription-cancel subscription-choose account-deletion-request auth-email-hook document-finalize"
          fi
          echo "liste=$LISTE" >> "$GITHUB_OUTPUT"
          echo "Ausgewählt: $LISTE"

      - name: Deno-Prüfung vor dem Ausrollen
        run: |
          # Ein Syntaxfehler soll hier auffallen und nicht erst, wenn die
          # Function beim ersten echten Aufruf 500 wirft.
          for F in ${{ steps.auswahl.outputs.liste }}; do
            echo "── prüfe $F"
            deno check "supabase/functions/$F/index.ts" || exit 1
          done

      - name: Tests der geteilten Module
        run: deno test --allow-env --allow-net supabase/functions/_shared/ || exit 1

      - name: Ausrollen
        run: |
          TROCKEN="${{ github.event.inputs.dry_run }}"
          for F in ${{ steps.auswahl.outputs.liste }}; do
            if [ ! -d "supabase/functions/$F" ]; then
              echo "::error::supabase/functions/$F gibt es nicht"
              exit 1
            fi
            if [ "$TROCKEN" = "true" ]; then
              echo "würde ausrollen: $F"
              continue
            fi
            echo "── rolle aus: $F"
            # --no-verify-jwt NICHT pauschal setzen. Die Einstellung je
            # Function bleibt die, die in Supabase hinterlegt ist; nur
            # email-inbound und iot-webhook laufen bewusst ohne JWT, weil
            # ein Webhook sich nicht anmelden kann, und die tragen ihre
            # Prüfung selbst (HMAC).
            supabase functions deploy "$F" --project-ref "$PROJECT_REF"
          done

      - name: Ergebnis
        if: always()
        run: |
          echo "### Ausgerollt" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.auswahl.outputs.liste }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
