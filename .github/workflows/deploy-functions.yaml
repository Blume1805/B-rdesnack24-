# =============================================================================
# Edge Functions ausrollen
# -----------------------------------------------------------------------------
# Warum es diesen Ablauf gibt:
#
# Aus der Arbeitsumgebung heraus lässt sich `api.supabase.com` nicht
# erreichen — der Egress-Proxy lehnt den Host per Richtlinie ab (403). Damit
# ist das Supabase-CLI dort tot, unabhängig davon, ob ein gültiger Token
# vorliegt. Bis dahin blieb nur, Dateiinhalte einzeln über die
# MCP-Schnittstelle hochzuladen: bei ~28 KB je Mail-Funktion mühsam,
# fehleranfällig und nie nachweislich byte-genau.
#
# Ein GitHub-Runner hat diese Beschränkung nicht. Er checkt den Stand aus,
# den ihr auch lest, und rollt ihn unverändert aus. Damit ist das, was in
# Supabase läuft, wieder dasselbe wie das, was im Repository steht — und
# genau das war zuletzt nicht mehr sicher.
#
# -----------------------------------------------------------------------------
# Einmalige Einrichtung
#
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#     Name:  SUPABASE_ACCESS_TOKEN
#     Wert:  ein Token aus https://supabase.com/dashboard/account/tokens
#
# Bitte einen FRISCHEN Token anlegen. Ein Token, der einmal durch einen Chat
# gelaufen ist, gilt als offengelegt — er steht dort dauerhaft im Verlauf.
#
# -----------------------------------------------------------------------------
# Absichtlich nie von allein
#
# Kein Ausrollen bei jedem Push. Eine Edge Function greift sofort und für
# alle; ein Tippfehler in `auth-email-hook` legt die Anmeldung lahm, ohne
# dass ein Test dazwischen wäre. Wann etwas produktiv geht, entscheidet ein
# Mensch — per Knopf oder per Tag, siehe unten.
# =============================================================================
name: Edge Functions ausrollen

# -----------------------------------------------------------------------------
# Zwei Auslöser, und der zweite ist nicht Bequemlichkeit
#
# GitHub erkennt `workflow_dispatch` nur, wenn die Datei auf dem
# **Standard-Branch** liegt. Solange diese Arbeit auf einem eigenen Branch
# läuft, gibt es den Knopf für GitHub schlicht nicht — der Aufruf endet mit
# 404, egal welchen `ref` man mitgibt.
#
# Ein Tag-Push dagegen führt den Ablauf von genau dem Stand aus, der getaggt
# wurde. Und ein Tag zu setzen ist dieselbe bewusste Handlung wie ein
# Knopfdruck, nur dass sie zusätzlich festhält, WAS ausgerollt wurde. Sobald
# die Datei auf dem Standard-Branch liegt, funktioniert auch der Knopf; der
# Tag-Weg bleibt daneben nützlich.
#
# Trockenlauf oder echt entscheidet der Tag-Name — bei einem Tag-Push gibt
# es keine Eingabefelder, und ein fehlendes Feld würde sonst stillschweigend
# „echt ausrollen" bedeuten. Das ist die falsche Richtung zum Irren.
#
#   functions-dryrun-<was-auch-immer>   → zeigt nur an
#   functions-deploy-<was-auch-immer>   → rollt aus
# -----------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      functions:
        description: >-
          Welche Functions? Leer lassen für die fünf offenen. "alle" rollt
          jede Function im Verzeichnis aus.
        required: false
        default: ''
      dry_run:
        description: 'Nur anzeigen, was ausgerollt würde'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'functions-dryrun-*'
      - 'functions-deploy-*'

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: supabase functions deploy
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nnfsyuglkqycwenwxmuw

    steps:
      - uses: actions/checkout@v4

      - name: Token vorhanden?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Das Secret SUPABASE_ACCESS_TOKEN fehlt. Siehe Kopf dieser Datei."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Deno ist auf dem Runner NICHT vorinstalliert. Beim ersten Lauf
      # (04.08.2026) scheiterte der Ablauf genau daran — `deno: command not
      # found` in der Prüfung, nachdem die Auswahl bereits korrekt stand.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Modus bestimmen
        id: modus
        # Tag-Name und Eingaben laufen über die Umgebung, nicht direkt in den
        # Skripttext. Ein Tag darf jeder setzen, der pushen darf, und ein
        # Name mit Anführungszeichen und Semikolon würde sonst als Befehl
        # gelesen.
        env:
          EREIGNIS:  ${{ github.event_name }}
          TAG:       ${{ github.ref_name }}
          EIN_DRY:   ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$EREIGNIS" = "workflow_dispatch" ]; then
            TROCKEN="$EIN_DRY"
          else
            case "$TAG" in
              functions-dryrun-*) TROCKEN=true ;;
              *)                  TROCKEN=false ;;
            esac
          fi
          echo "trocken=$TROCKEN" >> "$GITHUB_OUTPUT"
          echo "Modus: ${TROCKEN:-false} (Auslöser: $EREIGNIS${TAG:+, Tag $TAG})"

      - name: Auswahl bestimmen
        id: auswahl
        env:
          EINGABE: ${{ github.event.inputs.functions }}
        run: |
          if [ "$EINGABE" = "alle" ]; then
            # Alles ausser _shared — das ist kein Deployziel, sondern werden
            # als relative Importe mitgezogen.
            LISTE=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d \
                      ! -name '_shared' -printf '%f\n' | sort | tr '\n' ' ')
          elif [ -n "$EINGABE" ]; then
            LISTE="$EINGABE"
          else
            # Die fünf, die auf dieses Ausrollen warten: vier Mail-Functions
            # (DB-Vorlagen + Maskierung von title/preheader in components.ts)
            # und document-finalize (Finanzzahlen).
            LISTE="subscription-cancel subscription-choose account-deletion-request auth-email-hook document-finalize"
          fi
          echo "liste=$LISTE" >> "$GITHUB_OUTPUT"
          echo "Ausgewählt: $LISTE"

      # Zuerst prüfen, ob es die Functions auf DIESEM Stand überhaupt gibt.
      #
      # Beim ersten echten Lauf (04.08.2026) wurde versehentlich gegen `main`
      # gestartet. Dort fehlt `auth-email-hook` ganz, weil er auf dem
      # Arbeitsbranch entstanden ist. Der Abbruch kam damals erst aus
      # `deno check` — als Modulfehler, der nach einem Codeproblem aussah
      # statt nach „falscher Branch gewählt".
      #
      # Der Ablauf rollt immer den Stand aus, gegen den er gestartet wurde.
      # Solange die Arbeit auf einem Branch liegt, muss beim Starten unter
      # „Use workflow from" dieser Branch gewählt werden — nicht `main`.
      - name: Sind die Functions auf diesem Stand vorhanden?
        env:
          LISTE: ${{ steps.auswahl.outputs.liste }}
          REF:   ${{ github.ref_name }}
        run: |
          FEHLT=""
          for F in $LISTE; do
            [ -d "supabase/functions/$F" ] || FEHLT="$FEHLT $F"
          done
          if [ -n "$FEHLT" ]; then
            echo "::error::Auf '$REF' fehlen diese Functions:$FEHLT — vermutlich wurde der falsche Branch gewählt. Der Ablauf rollt immer den Stand aus, gegen den er gestartet wurde."
            exit 1
          fi
          echo "Alle ausgewählten Functions sind auf '$REF' vorhanden."

      - name: Deno-Prüfung vor dem Ausrollen
        env:
          LISTE: ${{ steps.auswahl.outputs.liste }}
        run: |
          # Ein Syntaxfehler soll hier auffallen und nicht erst, wenn die
          # Function beim ersten echten Aufruf 500 wirft.
          for F in $LISTE; do
            echo "── prüfe $F"
            deno check "supabase/functions/$F/index.ts" || exit 1
          done

      - name: Tests der geteilten Module
        run: deno test --allow-env --allow-net supabase/functions/_shared/ || exit 1

      - name: Ausrollen
        env:
          TROCKEN: ${{ steps.modus.outputs.trocken }}
          LISTE:   ${{ steps.auswahl.outputs.liste }}
        run: |
          for F in $LISTE; do
            if [ ! -d "supabase/functions/$F" ]; then
              echo "::error::supabase/functions/$F gibt es nicht"
              exit 1
            fi
            if [ "$TROCKEN" = "true" ]; then
              echo "würde ausrollen: $F"
              continue
            fi
            echo "── rolle aus: $F"
            # --no-verify-jwt NICHT pauschal setzen. Die Einstellung je
            # Function bleibt die, die in Supabase hinterlegt ist; nur
            # email-inbound und iot-webhook laufen bewusst ohne JWT, weil
            # ein Webhook sich nicht anmelden kann, und die tragen ihre
            # Prüfung selbst (HMAC).
            supabase functions deploy "$F" --project-ref "$PROJECT_REF"
          done

      - name: Ergebnis
        if: always()
        env:
          TROCKEN: ${{ steps.modus.outputs.trocken }}
          LISTE:   ${{ steps.auswahl.outputs.liste }}
        run: |
          if [ "$TROCKEN" = "true" ]; then
            echo "### Trockenlauf — nichts ausgerollt" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Ausgerollt" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$LISTE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
