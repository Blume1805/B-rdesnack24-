name: Deploy Web-Demo

# Baut das Flutter-Web-Bundle und deployt es nach gh-pages — identisch zum
# lokalen `scripts/deploy_web.sh` (lokales CanvasKit, versionierter Service
# Worker, Cache-Buster). Läuft bei jedem Push auf main sowie manuell über
# workflow_dispatch, damit die Live-Demo automatisch auf Branch-Stand bleibt.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Build + gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Voller Verlauf: das Deploy-Skript wechselt lokal auf gh-pages.
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: gh-pages-Branch lokal verfügbar machen
        run: git fetch origin gh-pages && git branch -f gh-pages origin/gh-pages
      - name: Git-Identität
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Dependencies
        run: flutter pub get
        working-directory: apps/mobile
      - name: Arbeitsstand nach `pub get` bereinigen
        # `flutter pub get` kann verfolgte Dateien anfassen. `deploy_web.sh`
        # wechselt am Ende auf den gh-pages-Zweig und bricht dabei ab, wenn
        # etwas offen ist. In der Werkbank ist die Arbeitskopie frisch geklont,
        # hier kann also nichts verlorengehen — anders als auf einem
        # Entwicklerrechner, wo das Skript deshalb bewusst abbricht statt
        # aufzuraeumen.
        run: |
          git checkout -- .
          git status --short
      - name: Build-Konfiguration aus den Repository-Secrets schreiben
        # apps/mobile/env/*.json ist in .gitignore (dort stehen Zugangsdaten).
        # In der Werkbank existiert die Datei also nicht, und `deploy_web.sh`
        # baut ohne sie eine App, die keine Datenbankverbindung kennt:
        # AppConfig.isValid wird false, der Nutzer sieht "nicht konfiguriert".
        # Bis zum 17.09.2026 fiel das nicht auf, weil der letzte Deploy
        # (04.09.2026) von Hand lief, mit einer lokal vorhandenen demo.json.
        # Der erste Lauf dieses Workflows haette den funktionierenden Stand
        # durch einen toten ersetzt.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Vorhandensein allein genuegt nicht. Am 17.09.2026 lief eine
          # Auslieferung durch, in deren Paket zwar der Schluessel steckte, aber
          # keine Projektadresse — ein Wert kann gesetzt und trotzdem unbrauchbar
          # sein (Leerzeichen, abgeschnitten, verwechselt). Deshalb wird die Form
          # geprueft. Die Werte selbst tauchen im Protokoll nie auf; GitHub
          # ersetzt sie durch ***, gemeldet werden nur Laenge und Befund.
          fehler=0
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL ist nicht gesetzt."
            fehler=1
          elif ! printf '%s' "$SUPABASE_URL" | grep -Eq '^https://[a-z0-9]+\.supabase\.co/?$'; then
            echo "::error::SUPABASE_URL hat nicht die erwartete Form https://<kennung>.supabase.co (Laenge: ${#SUPABASE_URL} Zeichen). Bitte den Wert Project URL aus Project Settings → Data API erneut kopieren — ohne Leerzeichen und ohne Zeilenumbruch davor oder dahinter."
            fehler=1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY ist nicht gesetzt."
            fehler=1
          elif ! printf '%s' "$SUPABASE_ANON_KEY" | grep -Eq '^(eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+|sb_publishable_[A-Za-z0-9_-]+)$'; then
            echo "::error::SUPABASE_ANON_KEY hat nicht die erwartete Form (Laenge: ${#SUPABASE_ANON_KEY} Zeichen). Erwartet wird der Wert anon public aus dem Reiter 'Legacy anon, service_role' — er beginnt mit eyJ und enthaelt zwei Punkte."
            fehler=1
          fi
          if [ "$fehler" = "1" ]; then
            echo "::error::Abbruch vor dem Bauen. Es wurde nichts veroeffentlicht; der bisherige Stand im Netz bleibt unveraendert."
            exit 1
          fi
          mkdir -p apps/mobile/env
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_ANON_KEY" \
            '{SUPABASE_URL: $url, SUPABASE_ANON_KEY: $key, APP_ENV: "prod",
              SENTRY_DSN: "", POSTHOG_API_KEY: "",
              POSTHOG_HOST: "https://eu.posthog.com", GOOGLE_REVIEW_URL: ""}' \
            > apps/mobile/env/demo.json
          echo "Konfiguration geschrieben (Werte sind maskiert)."
      - name: Build + Deploy
        # Ohne CUSTOM_DOMAIN kompiliert das Skript den Basispfad
        # /B-rdesnack24-/ ein und schreibt keine CNAME-Datei. Unter
        # app.boerdesnack24.de suchte der Browser dann alle Dateien in einem
        # Unterordner, der es nicht gibt — sichtbar als weisse Seite.
        env:
          CUSTOM_DOMAIN: app.boerdesnack24.de
        run: bash scripts/deploy_web.sh
