<html lang="de">
<head>
<meta charset="utf-8">
<title>Standortgeber-Film</title>
<!--
  Bördesnack24 · Erklärfilm für Standortgeber (Landingpage, Abschnitt „Für Standortgeber").
  Deterministisch: window.render(t) zeichnet den Zustand zur Sekunde t. render.mjs
  ruft das Bild für Bild auf und kodiert mit ffmpeg. ?f=16x9 (Standard) oder ?f=9x16.
  ?t=12.3 zeigt ein Standbild, ?play=1 spielt in Echtzeit ab (Vorschau im Browser).
  Inhalte nur aus wahren, beschlossenen Aussagen (README.md, Abschnitt Inhalte).
-->
<style>

@font-face { font-family: "Bricolage"; font-weight: 800; src: url("../../../apps/mobile/assets/fonts/BricolageGrotesque-ExtraBold.ttf"); }
@font-face { font-family: "Hanken"; font-weight: 400; src: url("../../../apps/mobile/assets/fonts/HankenGrotesk-Regular.ttf"); }
@font-face { font-family: "Hanken"; font-weight: 600; src: url("../../../apps/mobile/assets/fonts/HankenGrotesk-SemiBold.ttf"); }
@font-face { font-family: "Hanken"; font-weight: 700; src: url("../../../apps/mobile/assets/fonts/HankenGrotesk-Bold.ttf"); }
@font-face { font-family: "Hanken"; font-weight: 800; src: url("../../../apps/mobile/assets/fonts/HankenGrotesk-ExtraBold.ttf"); }

:root {
  --ink: #202321; --gold: #FDC102; --cream: #FBF8F4; --grey: #DCD8D3;
  --green: #5C9A3F; --muted: #5E5A54; --gold-text: #856A00;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #111; overflow: hidden; }
#stage {
  position: relative; overflow: hidden; background: var(--cream);
  font-family: "Hanken", sans-serif; color: var(--ink);
  transform-origin: 0 0;
}
.f16x9 #stage { width: 1920px; height: 1080px; }
.f9x16 #stage { width: 1080px; height: 1920px; }

/* Hintergrund: Bördekarte als ruhiges Raster, bewegt sich langsam */
#grain { position: absolute; inset: 0; pointer-events: none; }

/* Kopfzeile */
#brandbar { position: absolute; display: flex; align-items: center; gap: 16px; }
.f16x9 #brandbar { left: 130px; top: 70px; }
.f9x16 #brandbar { left: 90px; top: 110px; }
#brandbar .name { font-family: "Bricolage"; font-weight: 800; font-size: 30px; letter-spacing: -0.02em; }
#brandbar .sep { width: 2px; height: 26px; background: var(--grey); }
#brandbar .aud { font-weight: 600; font-size: 24px; color: var(--muted); }

/* Kapitel-Fortschritt */
#progress { position: absolute; display: flex; gap: 14px; }
.f16x9 #progress { left: 130px; top: 970px; }
.f9x16 #progress { left: 90px; top: 1790px; }
.seg { width: 120px; }
.seg .bar { height: 6px; border-radius: 3px; background: var(--grey); overflow: hidden; }
.seg .fill { height: 100%; width: 100%; background: var(--ink); transform-origin: 0 50%; transform: scaleX(0); }
.seg .lbl { margin-top: 12px; font-weight: 700; font-size: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Textblöcke je Szene */
.txt { position: absolute; }
.f16x9 .txt { left: 130px; width: 720px; top: 540px; transform: translateY(-50%); }
.f9x16 .txt { left: 90px; width: 900px; top: 250px; }
.chip {
  display: inline-flex; align-items: center; gap: 12px; height: 52px; padding: 0 22px 0 8px;
  border-radius: 26px; background: var(--ink); color: var(--cream);
  font-weight: 700; font-size: 24px; margin-bottom: 30px;
}
.chip b { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 19px;
  background: var(--gold); color: var(--ink); font-family: "Bricolage"; font-weight: 800; font-size: 20px; }
.chip.plain { padding: 0 22px; }
h1, h2 { font-family: "Bricolage"; font-weight: 800; letter-spacing: -0.03em; line-height: 0.98; }
.f16x9 h1 { font-size: 104px; } .f9x16 h1 { font-size: 112px; }
.f16x9 h2 { font-size: 92px; }  .f9x16 h2 { font-size: 100px; }
.sub { margin-top: 30px; font-weight: 400; line-height: 1.32; color: #3B3A37; }
.f16x9 .sub { font-size: 36px; } .f9x16 .sub { font-size: 42px; }
.w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.08em; margin-bottom: -0.08em; }
.wi { display: inline-block; will-change: transform; }
.mark { position: relative; }
.mark::after { content: ""; position: absolute; left: -0.04em; right: -0.04em; bottom: 0.06em; height: 0.2em;
  background: var(--gold); z-index: -1; transform-origin: 0 50%; transform: scaleX(var(--m, 0)); }

/* Illustration */
#art { position: absolute; overflow: visible; }
.f16x9 #art { left: 900px; top: 60px; width: 960px; height: 960px; }
.f9x16 #art { left: 40px; top: 790px; width: 1000px; height: 1000px; }
svg text { font-family: "Hanken"; }

/* Abschluss */

#end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--cream); }

#end .mail { margin-top: 24px; font-weight: 600; font-size: 30px; color: #CFC9C0; }
</style>

<script>
// ───────────────────────── Grundlagen ─────────────────────────
const q = new URLSearchParams(location.search);
const FMT = q.get("f") === "9x16" ? "9x16" : "16x9";
document.documentElement.className = "f" + FMT;
const PORTRAIT = FMT === "9x16";
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const svgEl = (tag, attrs, parent) => {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(el);
  return el;
};

// Kurven aus motion/motion-tokens.css (keine eigenen erfinden)
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = (t) => ((ax * t + bx) * t + cx) * t;
  const sy = (t) => ((ay * t + by) * t + cy) * t;
  const dsx = (t) => (3 * ax * t + 2 * bx) * t + cx;
  return (x) => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) { const d = dsx(t); if (Math.abs(d) < 1e-6) break; t -= (sx(t) - x) / d; }
    t = Math.min(1, Math.max(0, t));
    return sy(t);
  };
}
const E = {
  out: bezier(0.22, 1, 0.36, 1),
  inout: bezier(0.65, 0, 0.35, 1),
  bounce: bezier(0.34, 1.56, 0.64, 1),
  snap: bezier(0.2, 0.9, 0.1, 1),
  lin: (x) => Math.min(1, Math.max(0, x)),
};
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const k = (t, start, dur, ease = E.out) => ease(clamp((t - start) / dur));
const lerp = (a, b, p) => a + (b - a) * p;
const set = (el, attrs) => { for (const a in attrs) el.setAttribute(a, attrs[a]); };

// ───────────────────────── Dramaturgie ─────────────────────────
// Szenen [Start, Ende] in Sekunden. Gesamtlänge = END.
const S = {
  intro:   [0.0, 4.6],
  ort:     [4.6, 10.0],
  brauchen:[10.0, 16.2],
  bekommen:[16.2, 22.4],
  tragen:  [22.4, 27.8],
  spende:  [27.8, 33.4],
  ende:    [33.4, 39.0],
};
const DURATION = 39.0;
const CHAPTERS = ["ort", "brauchen", "bekommen", "tragen"];

const TEXT = {
  intro:    { chip: null, eyebrow: "Für Standortgeber", h: "Sie stellen die Fläche. Wir tragen den Rest.", sub: "Wir suchen Standorte in Osterweddingen und den Nachbarorten.", tag: "h1", mark: "Fläche." },
  ort:      { chip: "01", eyebrow: "Der Ort", h: "Der passende Ort.", sub: "Betrieb, Sporthalle oder Treffpunkt im Ort. Wir stellen den Automaten auf." },
  brauchen: { chip: "02", eyebrow: "Was wir brauchen", h: "Was wir brauchen.", sub: "Stellfläche, Strom und Zugang zum Befüllen." },
  bekommen: { chip: "03", eyebrow: "Was Sie bekommen", h: "Was Sie bekommen.", sub: "Feste Miete oder Anteil am Umsatz. Was passt, klären wir im Gespräch." },
  tragen:   { chip: "04", eyebrow: "Was wir übernehmen", h: "Wir tragen den Rest.", sub: "Anschaffung, Wartung und Befüllung liegen bei uns.", mark: "Rest." },
  spende:   { chip: null, eyebrow: "Gut zu wissen", h: "Die Spende an die Region zahlen wir.", sub: "Ihre Vergütung bleibt davon unberührt." },
};

// ───────────────────────── Aufbau ─────────────────────────
const textBlocks = {};
for (const key in TEXT) {
  const d = TEXT[key];
  const box = document.createElement("div");
  box.className = "txt";
  const chip = document.createElement("div");
  chip.className = "chip" + (d.chip ? "" : " plain");
  chip.innerHTML = (d.chip ? `<b>${d.chip}</b>` : "") + d.eyebrow;
  box.appendChild(chip);
  const h = document.createElement(d.tag || "h2");
  const words = [];
  d.h.split(" ").forEach((w, i, arr) => {
    const outer = document.createElement("span"); outer.className = "w";
    const inner = document.createElement("span"); inner.className = "wi";
    inner.textContent = w;
    if (d.mark && w === d.mark) inner.classList.add("mark");
    outer.appendChild(inner); h.appendChild(outer);
    if (i < arr.length - 1) h.appendChild(document.createTextNode(" "));
    words.push(inner);
  });
  box.appendChild(h);
  const sub = document.createElement("p"); sub.className = "sub"; sub.textContent = d.sub;
  box.appendChild(sub);
  $("texts").appendChild(box);
  textBlocks[key] = { box, chip, words, sub, mark: box.querySelector(".mark") };
}

const vis = (el, o) => { el.style.opacity = o; el.setAttribute && el.setAttribute("opacity", o); };
const show = (el, on) => { el.style.display = on ? "" : "none"; };
const tr = (el, x, y, s = 1, r = 0) => el.setAttribute("transform", `translate(${x} ${y}) rotate(${r}) scale(${s})`);

function renderText(key, t) {
  const [a, b] = S[key];
  const tb = textBlocks[key];
  const active = t >= a - 0.01 && t < b + 0.01;
  tb.box.style.display = active ? "" : "none";
  if (!active) return;
  const pIn = k(t, a + 0.1, 0.5);
  tb.chip.style.opacity = pIn;
  tb.chip.style.transform = `translateY(${(1 - pIn) * 16}px)`;
  tb.words.forEach((w, i) => {
    const p = k(t, a + 0.25 + i * 0.07, 0.75);
    w.style.transform = `translateY(${(1 - p) * 105}%)`;
  });
  const n = tb.words.length;
  const ps = k(t, a + 0.45 + n * 0.07, 0.7);
  tb.sub.style.opacity = ps;
  tb.sub.style.transform = `translateY(${(1 - ps) * 18}px)`;
  if (tb.mark) tb.mark.style.setProperty("--m", k(t, a + 0.6 + n * 0.07, 0.6, E.inout));
  const pOut = k(t, b - 0.45, 0.42, E.inout);
  const base = PORTRAIT ? "" : "translateY(-50%) ";
  tb.box.style.transform = base + `translateY(${-pOut * 36}px)`;
  tb.box.style.opacity = 1 - pOut;
}

function render(t) {
  for (const key in TEXT) renderText(key, t);

  // Kopfzeile und Kapitel
  const pBar = k(t, S.ort[0] - 0.2, 0.6) * (1 - k(t, S.ende[0] - 0.3, 0.4));

  $("progress").style.opacity = pBar;

  });
  const pg = k(t, tLight, 0.6);
  vis($("mGlow"), 0.32 * pg);
  $("mDisp").setAttribute("fill", pg > 0.5 ? "#5C9A3F" : "#3A3F3C");

  // ── S1 Orte ──
  {
    const [a, b] = S.ort;
    const on = t > a - 0.1 && t < b + 0.1;
    show($("places"), on); show($("s1extra"), on);
    if (on) {
      const pOut = k(t, b - 0.6, 0.55, E.inout);
      // Auswahl wandert über die Karten und bleibt in der Mitte
      const hops = [a + 1.3, a + 1.75, a + 2.2];
      const order = [0, 2, 1];
      let sel = -1;
      hops.forEach((h, i) => { if (t >= h) sel = order[i]; });
      places.forEach((p, i) => {
        const pi = k(t, a + 0.2 + i * 0.12, 0.7);
        const isSel = sel === i;
        const lift = isSel ? k(t, hops[order.indexOf(i)], 0.35, E.bounce) : 0;
        const others = sel === 1 && i !== 1 ? k(t, hops[2] + 0.3, 0.5) : 0;
        tr(p.g, p.x, 70 + (1 - pi) * 60 - pOut * 40, 1);
        vis(p.g, pi * (1 - 0.55 * others) * (1 - pOut));
        tr(p.inner, 0, -lift * 14, 1 + lift * 0.05);
        set(p.frame, { fill: isSel ? "#FFF1C2" : "#fff", "stroke-width": isSel ? 8 : 6 });
      });
      const pLine = k(t, a + 2.6, 0.4);
      set($("dropLine"), { opacity: pLine * (1 - pOut) });
      const pPin = k(t, a + 2.5, 0.5, E.bounce);
      tr($("pinS1"), 500, 470, pPin);
      vis($("pinS1"), (pPin > 0 ? 1 : 0) * (1 - pOut));
      const pPill = k(t, a + 3.55, 0.5, E.bounce);
      tr($("pillS1"), 790, 700, lerp(0.6, 1, pPill));
      vis($("pillS1"), k(t, a + 3.55, 0.2) * (1 - pOut));
    }
  }

  // ── S2 Was wir brauchen ──
  {
    const [a, b] = S.brauchen;
    const on = t > a - 0.1 && t < b + 0.1; show($("s2"), on);
    if (on) {
      const pOut = k(t, b - 0.6, 0.55, E.inout);
      vis($("s2"), 1 - pOut);
      // Stellfläche
      const pf = k(t, a + 0.5, 0.7, E.inout);
      draw("floor", pf); set($("floor"), { "fill-opacity": k(t, a + 0.9, 0.4) });
      draw("dimLine", k(t, a + 0.9, 0.5, E.inout)); vis($("dim"), k(t, a + 0.9, 0.2));
      vis($("l2a"), k(t, a + 1.1, 0.4));
      // Zugang: Schlüssel dreht
      const pk = k(t, a + 1.2, 0.4);
      tr($("key"), 130, 520 + (1 - pk) * 30, 1); vis($("key"), pk);
      tr($("keyRot"), 0, 0, 1, -90 * k(t, a + 1.7, 0.6, E.bounce));
      vis($("l2c"), k(t, a + 1.5, 0.4));
      // Strom: Kabel läuft zur Dose
      const ps = k(t, a + 1.6, 0.4); vis($("socket"), ps); vis($("l2b"), k(t, a + 1.8, 0.4));
      draw("cable", k(t, a + 2.0, 0.9, E.inout));
      const pp = k(t, a + 2.75, 0.3, E.bounce);
      vis($("plug"), k(t, a + 2.7, 0.1)); tr($("plug"), 868 + (1 - pp) * -16, 548 + (1 - pp) * 16, 1);
      const pk2 = clamp((t - (a + 3.0)) / 0.45);
      sparks.forEach(({ a: ang, el }) => {
        const r1 = 62 + pk2 * 30, r2 = r1 + 26 * (1 - pk2);
        set(el, { x1: Math.cos(ang) * r1, y1: Math.sin(ang) * r1, x2: Math.cos(ang) * r2, y2: Math.sin(ang) * r2, opacity: pk2 > 0 && pk2 < 1 ? 1 - pk2 : 0 });
      });
      // Haken
      [a + 1.3, a + 3.2, a + 2.1].forEach((tc, i) => {
        const g = checks2[i]; const p = k(t, tc, 0.45, E.bounce);
        tr(g, +g.dataset.x, +g.dataset.y, p); vis(g, p > 0 ? 1 : 0);
      });
    }
  }

  // ── S3 Was Sie bekommen ──
  {
    const [a, b] = S.bekommen;
    const on = t > a - 0.1 && t < b + 0.1; show($("s3"), on);
    if (on) {
      const pOut = k(t, b - 0.6, 0.55, E.inout);
      const pc = k(t, a + 0.35, 0.8);
      tr($("s3"), 0, (1 - pc) * 50 - pOut * 30); vis($("s3"), Math.min(pc, 1 - pOut));
      vis($("cl1"), k(t, a + 0.7, 0.3)); vis($("cl2"), k(t, a + 0.8, 0.3));
      // Auswahl pendelt: Miete, Umsatz, Miete … dann Gespräch
      const t1 = a + 1.2, t2 = a + 2.2, t3 = a + 3.1;
      const y1 = 368, y2 = 538;
      let hy = y1, hv = k(t, t1, 0.3);
      hy = lerp(y1, y2, k(t, t2, 0.45, E.snap));
      hy = lerp(hy, y1, k(t, t3, 0.45, E.snap));
      const pHide = k(t, a + 3.9, 0.4, E.inout);
      set($("hl"), { y: hy, opacity: hv * (1 - pHide) });
      const c1 = (t >= t1 && t < t2 + 0.2) || (t >= t3 + 0.2 && t < a + 3.9);
      const c2 = t >= t2 + 0.2 && t < t3 + 0.2;
      draw("ck1", c1 ? k(t, t >= t3 ? t3 + 0.2 : t1, 0.3) : 0);
      draw("ck2", c2 ? k(t, t2 + 0.2, 0.3) : 0);
      set($("cb1"), { fill: c1 ? "#FDC102" : "#fff" }); set($("cb2"), { fill: c2 ? "#FDC102" : "#fff" });
      // Gespräch, dann Unterschrift
      const pt = k(t, a + 3.9, 0.5, E.bounce);
      tr($("talk"), 860, 712, pt); vis($("talk"), pt > 0 ? 1 : 0);
      draw("sig", k(t, a + 4.3, 1.0, E.inout));
    }
  }

  // ── S4 Sie | Wir ──
  {
    const [a, b] = S.tragen;
    const on = t > a - 0.1 && t < b + 0.1; show($("s4"), on);
    if (on) {
      const pOut = k(t, b - 0.6, 0.55, E.inout);
      vis($("s4"), 1 - pOut);
      vis($("colSie"), k(t, a + 0.3, 0.5));
      sieRows.forEach((r, i) => { const p = k(t, a + 0.5 + i * 0.12, 0.6); tr(r.inner, (1 - p) * -30, 0); vis(r.g, p); });
      vis($("s4div"), k(t, a + 0.6, 0.5));
      vis($("colWir"), k(t, a + 1.2, 0.5));
      wirRows.forEach((r, i) => { const p = k(t, a + 1.5 + i * 0.32, 0.55, E.bounce); tr(r.inner, (1 - p) * 40, 0, lerp(0.85, 1, p)); vis(r.g, k(t, a + 1.5 + i * 0.32, 0.2)); });
    }
  }

  // ── S5 Spende ──
  {
    const [a, b] = S.spende;
    const on = t > a - 0.1 && t < b + 0.1; show($("s5"), on);
    if (on) {
      const pA = k(t, a + 0.35, 0.7); tr($("cardA"), (1 - pA) * 40, 0); vis($("cardA"), pA);
      const pB = k(t, a + 0.6, 0.7); tr($("cardB"), (1 - pB) * 40, 0); vis($("cardB"), pB);
      const pL = k(t, a + 3.4, 0.45, E.bounce); tr($("lockA"), 490, 330, lerp(0.8, 1, pL)); vis($("lockA"), pL > 0 ? 1 : 0);
      // Münzen fallen nur in die Spende
      coins5.forEach((c, i) => {
        const t0 = a + 1.4 + i * 0.32;
        const p = clamp((t - t0) / 0.75);
        const x0 = 300, y0 = 790, x1 = 850, y1 = 772;
        const x = lerp(x0, x1, E.inout(p));
        const y = lerp(y0, y1, p) - Math.sin(p * Math.PI) * 30;
        tr(c, x, y, p < 0.5 ? lerp(0.7, 1, p * 2) : lerp(1, 0.55, (p - 0.5) * 2), p * 200);
        vis(c, p > 0 && p < 1 ? 1 : 0);
      });
      // Herz schlägt bei jeder Münze
      let beat = 0;
      for (let i = 0; i < 5; i++) { const tc = a + 1.4 + i * 0.32 + 0.75; const d = t - tc; if (d > 0 && d < 0.3) beat = Math.max(beat, Math.sin((d / 0.3) * Math.PI)); }
      $("heart").setAttribute("transform", `scale(${1 + beat * 0.18})`);
      vis($("s5"), 1 - k(t, b - 0.5, 0.45, E.inout));
    }
  }

  // ── Abschluss ──
  {
    const [a] = S.ende;
    const on = t > a - 0.6; show($("endbg"), on); show($("end"), on);
    if (on) {
      const W = PORTRAIT ? 1080 : 1920, H = PORTRAIT ? 1920 : 1080;
      const pw = k(t, a - 0.5, 1.0, E.inout);
      const cx = W / 2, cy = H / 2;
      $("endbg").style.clipPath = `circle(${pw * Math.hypot(W, H) * 0.6}px at ${cx}px ${cy}px)`;
      draw("endRing", k(t, a + 0.2, 1.2, E.inout));
      const pm = k(t, a + 0.5, 0.8, E.bounce);
      tr($("endMachine"), 0, (1 - pm) * 30, lerp(0.6, 1, pm)); vis($("endMachine"), k(t, a + 0.5, 0.25));
      endCells.forEach((c, i) => vis(c, k(t, a + 0.85 + i * 0.05, 0.25)));
      [["endWord", 0.9], ["endClaim", 1.3], ["endCta", 1.8], ["endMail", 2.1]].forEach(([id, d]) => {
        const p = k(t, a + d, 0.7);
        $(id).style.opacity = p; $(id).style.transform = `translateY(${(1 - p) * 24}px)`;
      });
      const pulse = t > a + 2.6 ? 1 + 0.025 * Math.sin((t - a - 2.6) * Math.PI * 1.4) : 1;
      $("endCta").style.transform += ` scale(${pulse})`;
    }
  }
}

// Position des Automaten über alle Szenen
function machineState(t) {
  // Keyframes: [Zeit, x, y, s, o]
  const KF = [
    [S.ort[0] + 1.9, 500, -500, 0.9, 1],
    [S.ort[0] + 2.9, 500, 940, 0.9, 1],       // fällt in den Ort
    [S.brauchen[0], 500, 940, 0.9, 1],
    [S.brauchen[0] + 0.55, 500, 760, 0.95, 1], // steht auf der Stellfläche
    [S.bekommen[0], 500, 760, 0.95, 1],
    [S.bekommen[0] + 0.7, 245, 840, 0.82, 1],
    [S.tragen[0] - 0.05, 245, 840, 0.82, 1],
    [S.tragen[0] + 0.5, 245, 1100, 0.82, 0],   // tritt ab
    [S.spende[0], 245, 1100, 0.82, 0],
    [S.spende[0] + 0.7, 245, 860, 0.82, 1],
    [S.spende[1] - 0.4, 245, 860, 0.82, 1],
    [S.spende[1] + 0.2, 245, 860, 0.82, 0],
  ];
  let st = { x: 500, y: -600, s: 0.9, o: 0 };
  if (t < KF[0][0]) return { ...st, sx: 1, sy: 1, shadow: 0 };
  let i = 0;
  while (i < KF.length - 1 && t >= KF[i + 1][0]) i++;
  const A = KF[i], B = KF[Math.min(i + 1, KF.length - 1)];
  const isDrop = i === 0;
  let p = B[0] === A[0] ? 1 : clamp((t - A[0]) / (B[0] - A[0]));
  p = isDrop ? p * p : E.inout(p); // freier Fall, sonst weich
  st = { x: lerp(A[1], B[1], p), y: lerp(A[2], B[2], p), s: lerp(A[3], B[3], p), o: lerp(A[4], B[4], p) };
  // Aufsetzen: kurz stauchen
  const land = S.ort[0] + 2.9;
  const q1 = clamp((t - land) / 0.45);
  const squash = t >= land ? Math.sin(q1 * Math.PI) * (1 - q1) * 0.16 : 0;
  const shadow = t < land ? clamp(1 - (land - t) / 0.9) : 1;
  return { ...st, sx: 1 + squash, sy: 1 - squash, shadow };
}

window.DURATION = DURATION;
window.render = render;
window.ready = document.fonts.ready.then(() => { render(+(q.get("t") || 0)); return true; });

if (q.get("play")) {
  // Vorschau: Bühne an Fenster anpassen und in Echtzeit abspielen
  const fit = () => {
    const W = PORTRAIT ? 1080 : 1920, H = PORTRAIT ? 1920 : 1080;
    const s = Math.min(innerWidth / W, innerHeight / H);
    $("stage").style.transform = `scale(${s})`;
  };
  fit(); addEventListener("resize", fit);
  const t0 = performance.now();
  const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  window.ready.then(loop);
}
</script>
